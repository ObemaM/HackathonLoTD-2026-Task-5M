/**:
  ros__parameters:
    # Topic used by the five normal/moving bags.
    input_topic: /lidar_points
    output_prefix: /obstacle_detector
    detector_frame_id: train_lidar

    # Convert dataset sensor coordinates into a conventional detector frame:
    # detector X = forward, Y = left/lateral, Z = up.
    forward_axis: -y
    lateral_axis: x
    vertical_axis: z
    detector_offset_xyz: [0.0, 0.0, 0.0]

    # The supplied bags contain finite (0, 0, 0) padding, so min range must be > 0.
    min_valid_range_m: 0.3
    max_valid_range_m: 210.0
    voxel_leaf_size_m: 0.08
    far_voxel_leaf_size_m: 0.04

    corridor:
      min_forward_m: 2.0
      max_forward_m: 200.0
      center_lateral_m: 0.0
      width_m: 2.1
      bottom_z_m: -1.65
      height_m: 3.0
      floor_clearance_m: 0.04

    # Estimate our own pair of rails in a low height slice.  A dynamic-programming
    # search is anchored to the near-field pair, then grows outwards while
    # preserving rail identity.  A local centerline follows curves without a
    # global parabola bending early.  Competing branches truncate the trusted
    # corridor instead of forcing an arbitrary turnout choice.
    track:
      enabled: true
      max_forward_m: 90.0
      initial_center_lateral_m: 0.0
      search_half_width_m: 4.0
      rail_z_min_m: -1.75
      rail_z_max_m: -1.15
      gauge_m: 1.52
      max_gauge_error_m: 0.18
      rail_support_half_width_m: 0.14
      forward_bin_size_m: 2.0
      lateral_step_m: 0.05
      min_points_per_rail: 2
      min_support_bins: 6
      max_center_step_m: 0.55
      max_slope_change: 0.10
      seed_penalty: 20.0
      seed_search_bins: 5
      seed_max_offset_m: 0.85
      continuity_penalty: 6.0
      prior_penalty: 1.5
      prior_max_deviation_m: 0.65
      prior_deviation_growth_per_m: 0.015
      max_gap_bins: 1
      candidate_min_separation_m: 0.25
      branch_min_separation_m: 0.45
      branch_max_separation_m: 1.80
      branch_score_ratio: 0.75
      branch_min_growth_m_per_bin: 0.05
      branch_confirmation_bins: 4
      max_extrapolation_m: 2.0
      smoothing_alpha: 0.35
      fallback_frames: 5

    # Remove only a narrow band matching the two estimated rail heads.  We do
    # not remove all low points, because a cable or box can also lie on the floor.
    rail_mask:
      enabled: true
      lateral_tolerance_m: 0.12
      min_z_m: -1.62
      max_z_m: -1.05

    # Discover other persistent low lines (contact rail, guard rail, etc.) in
    # coordinates relative to the curved path. Compact objects occupy too few
    # forward bins and are not included in this mask.
    longitudinal_mask:
      enabled: true
      min_z_m: -1.65
      max_z_m: -1.00
      forward_bin_size_m: 2.0
      lateral_cell_size_m: 0.05
      lane_tolerance_m: 0.14
      # Follow a rail that curves by at most 24 cm per two-metre slice.
      max_lateral_step_m: 0.24
      min_points_per_bin: 2
      min_support_bins: 8
      max_gap_bins: 1
      max_lanes: 6
      # Contact/guard rails seen consistently in the five moving bags.
      fixed_offsets_m: [-1.0, 1.0]

    # Rail returns can remain connected through sleepers after point masking.
    # Reject only long, low clusters that still overlap an estimated rail. A
    # compact object and a cable away from the rail model are retained.
    infrastructure_filter:
      min_length_m: 3.0
      max_height_above_floor_m: 0.65
      rail_overlap_margin_m: 0.18

    clustering:
      tolerance_m: 0.30
      radius_growth: 0.006
      max_tolerance_m: 0.60
      min_points: 3
      max_points: 50000
      min_height_m: 0.08
      max_length_m: 8.0
      max_width_m: 2.5
      max_height_m: 3.2

    confirmation:
      required_frames: 3
      clear_frames: 2

    # ICP on surrounding infrastructure. Failed registration resets temporal state.
    motion:
      enabled: true
      accumulation_frames: 1  # opt in to 3 after checking registration on a sequence

    separators:
      # Experimental: real-bag replay found false separator chains in tunnel geometry.
      enabled: false  # soft hint only; never removes objects inside the corridor

    max_visualized_clusters: 12
    publish_debug_clouds: true
