/**:
  ros__parameters:
    input_topic: /sensing/lidar/hesai128/pointcloud
    output_prefix: /obstacle_detector
    detector_frame_id: train_lidar

    forward_axis: -y
    lateral_axis: x
    vertical_axis: z
    detector_offset_xyz: [0.0, 0.0, 0.0]

    min_valid_range_m: 0.3
    max_valid_range_m: 210.0
    voxel_leaf_size_m: 0.08

    # Initial visual estimate for this differently mounted lidar.
    # Recalibrate center_lateral_m and bottom_z_m in RViz before treating
    # these values as ground truth.
    corridor:
      min_forward_m: 0.5
      max_forward_m: 200.0
      center_lateral_m: 2.0
      width_m: 2.1
      bottom_z_m: -2.3
      height_m: 3.0
      floor_clearance_m: 0.04

    # Disabled until the rail height and lateral seed are calibrated for this
    # differently mounted lidar.  The detector safely falls back to the manual
    # straight corridor instead of trusting a low-confidence path.
    track:
      enabled: false
      max_forward_m: 90.0
      initial_center_lateral_m: 2.0
      search_half_width_m: 4.0
      rail_z_min_m: -2.40
      rail_z_max_m: -1.70
      gauge_m: 1.52
      max_gauge_error_m: 0.18
      rail_support_half_width_m: 0.14
      forward_bin_size_m: 2.0
      lateral_step_m: 0.05
      min_points_per_rail: 2
      min_support_bins: 6
      max_center_step_m: 0.55
      max_slope_change: 0.10
      seed_penalty: 20.0
      seed_search_bins: 5
      seed_max_offset_m: 0.85
      continuity_penalty: 6.0
      prior_penalty: 1.5
      prior_max_deviation_m: 0.65
      max_gap_bins: 1
      candidate_min_separation_m: 0.25
      branch_min_separation_m: 0.45
      branch_max_separation_m: 1.80
      branch_score_ratio: 0.75
      branch_min_growth_m_per_bin: 0.05
      branch_confirmation_bins: 4
      max_extrapolation_m: 2.0
      smoothing_alpha: 0.35
      fallback_frames: 5

    rail_mask:
      enabled: false
      lateral_tolerance_m: 0.12
      min_z_m: -2.10
      max_z_m: -1.75

    longitudinal_mask:
      enabled: false
      min_z_m: -2.30
      max_z_m: -1.65
      forward_bin_size_m: 2.0
      lateral_cell_size_m: 0.05
      lane_tolerance_m: 0.14
      max_lateral_step_m: 0.24
      min_points_per_bin: 2
      min_support_bins: 8
      max_gap_bins: 1
      max_lanes: 6

    infrastructure_filter:
      min_length_m: 3.0
      max_height_above_floor_m: 0.65
      rail_overlap_margin_m: 0.18

    clustering:
      tolerance_m: 0.30
      min_points: 3
      max_points: 50000
      min_height_m: 0.08
      max_length_m: 8.0
      max_width_m: 2.5
      max_height_m: 3.2

    confirmation:
      required_frames: 3
      clear_frames: 2

    # This static bag has many unmasked infrastructure clusters. Keep all of
    # them visible during calibration; otherwise the confirmed far person can
    # be hidden behind the 12 nearer marker slots even though it is tracked.
    max_visualized_clusters: 30
    publish_debug_clouds: true
